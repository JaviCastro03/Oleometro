name: Update data and deploy

# Zero-cost hosting: refresh the data every Monday, rebuild the static site and
# publish it on GitHub Pages. No server, no database, no secrets.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Download real data from the European Commission
        id: export
        continue-on-error: true
        working-directory: backend
        run: python -m scripts.export_static --source agridata --out ../frontend/public/data/dashboard.json

      - name: Warn when the live API was unavailable
        if: steps.export.outcome == 'failure'
        run: |
          echo "::warning title=Datos reales no disponibles::La API de la Comisión Europea falló. Se publica el dataset de demostración incluido en el repositorio (la web lo indica con un aviso)."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
