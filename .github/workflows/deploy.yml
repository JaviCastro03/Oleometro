# ============================================================
# deploy.yml  ->  EL "REPARTIDOR" AUTOMÁTICO
# ------------------------------------------------------------
# Este robot hace el trabajo completo de publicar la web:
#   1) trae datos nuevos,
#   2) construye la web final,
#   3) la sube a GitHub Pages (la dirección pública).
# Es el que hace que tu web esté en internet y se actualice sola.
# (ci.yml solo revisa; este además PUBLICA.)
# ============================================================

# Nombre que verás en la pestaña "Actions"
name: Update data and deploy

# Hosting a coste cero: refresca los datos cada lunes, reconstruye la web
# estática y la publica en GitHub Pages. Sin servidor, sin base de datos
# y sin contraseñas.

# CUÁNDO se ejecuta (hay 3 formas de activarlo)
on:
  schedule:
    - cron: "0 6 * * 1" # reloj automático: lunes a las 06:00 UTC. Se lee "minuto hora día-mes mes día-semana" (1 = lunes)
  workflow_dispatch: # te permite lanzarlo a mano con el botón "Run workflow"
  push:
    branches: [main] # y también cada vez que subes código a main

# PERMISOS que le das al robot (solo los justos para publicar)
permissions:
  contents: read # puede leer tu código
  pages: write # puede escribir en GitHub Pages
  id-token: write # puede demostrar a GitHub Pages que es de verdad tu robot

# Si lanzas dos publicaciones a la vez, cancela la antigua y se queda con la más nueva.
# Así no se pisan entre ellas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest # el ordenador virtual de GitHub (Linux, gratis)
    environment:
      name: github-pages # le dice a GitHub que esto es la publicación en Pages
      url: ${{ steps.deployment.outputs.page_url }} # al terminar, guarda aquí la dirección final de tu web
    steps:
      # ---- Preparar el ordenador ----

      # Descargar tu código
      - uses: actions/checkout@v4

      # Instalar Python 3.12 (hace falta para descargar los datos)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # recuerda las librerías para ir más rápido
          cache-dependency-path: backend/requirements.txt # se renueva si cambia la lista de librerías

      # Instalar las librerías de Python (aquí sin las de test, solo las necesarias)
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # ---- Conseguir los datos ----

      # Pide los precios reales a la Comisión Europea y los guarda en
      # frontend/public/data/dashboard.json (el archivo que luego lee la web).
      - name: Download real data from the European Commission
        id: export # un nombre para poder consultar después cómo le fue
        continue-on-error: true # MUY IMPORTANTE: si falla, el robot NO se detiene; sigue y publica los datos de demo
        working-directory: backend
        run: python -m scripts.export_static --source agridata --out ../frontend/public/data/dashboard.json

      # Si el paso anterior falló, deja un aviso amarillo en el registro para que lo veas
      - name: Warn when the live API was unavailable
        if: steps.export.outcome == 'failure' # solo se ejecuta si el paso "export" falló
        run: |
          echo "::warning title=Datos reales no disponibles::La API de la Comisión Europea falló. Se publica el dataset de demostración incluido en el repositorio (la web lo indica con un aviso)."

      # ---- Construir la web ----

      # Instalar Node.js 22 (el programa que ejecuta npm y Vite)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Instalar las librerías de React y construir la web final.
      # Vite deja el resultado en la carpeta frontend/dist.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- Publicar ----

      # Prepara GitHub Pages para recibir la web
      - uses: actions/configure-pages@v5

      # Empaqueta la carpeta frontend/dist para subirla
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # Publica el paquete en GitHub Pages. ¡Ahora tu web está en internet!
      - id: deployment
        uses: actions/deploy-pages@v4
