<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Precio semanal del aceite de oliva en origen en España, Italia, Grecia y Portugal, con datos abiertos de la Comisión Europea." />
    <meta name="theme-color" content="#E7EDDA" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Oleómetro · Precio del aceite de oliva</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('oleometro-theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Oleómetro necesita JavaScript para dibujar los gráficos.</noscript>
    <!-- The index wires exactly one thing: the entry that mounts the controller. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
